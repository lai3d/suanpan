name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, simulate, synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Recent Icarus Verilog, Verilator and Yosys in one bundle.
      - uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          yosys -V

      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data
          key: mnist-v1

      - name: Lint
        run: make lint

      - name: Train, quantize and export the networks
        run: |
          make model PY=python ARCH=cnn
          make model PY=python ARCH=mlp
          make model PY=python ARCH=stress

      - name: Simulate 100 images each (Icarus Verilog)
        run: |
          make sim PY=python ARCH=cnn
          make sim PY=python ARCH=mlp
          make sim PY=python ARCH=stress N=20

      - name: Simulate 10,000 images each (Verilator)
        run: |
          make sim-full PY=python ARCH=cnn
          make sim-full PY=python ARCH=mlp
          make sim-full PY=python ARCH=stress N_FULL=2000

      - name: Compiler tests (ONNX import, rewrites, round trip)
        run: make test-compiler PY=python

      - name: PyTorch LeNet-5 from ONNX, 300 images (Verilator)
        run: |
          make lenet5 PY=python
          make sim-full PY=python MEM=build/lenet5 N_FULL=300

      - name: PyTorch CIFAR-10 network from ONNX, 32 images (Verilator)
        run: |
          make cifar10-ci PY=python
          make sim-full PY=python MEM=build/cifar10-ci N_FULL=32

      - name: Synthesize (SKY130)
        run: make synth

      - name: FPGA build of the CIFAR-10 network (place and route only)
        run: make fpga PY=python NET=build/cifar10-ci

      - name: FPGA wrapper, RTL simulation
        run: make fpga-sim PY=python

      - name: FPGA build and gate-level simulation (Tang Nano 20K)
        run: make fpga-gatesim PY=python
