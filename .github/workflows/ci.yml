name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, simulate, synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Recent Icarus Verilog, Verilator and Yosys in one bundle.
      - uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          yosys -V

      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data
          key: mnist-v1

      - name: Lint
        run: make lint

      - name: Train, quantize and export the model
        run: make model PY=python

      - name: Simulate 100 images (Icarus Verilog)
        run: make sim PY=python

      - name: Simulate 10,000 images (Verilator)
        run: make sim-full PY=python

      - name: Synthesize (SKY130)
        run: make synth
